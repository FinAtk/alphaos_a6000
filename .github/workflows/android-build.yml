name: ALPHA OS Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install legacy Android SDK packages
        run: |
          sdkmanager "platforms;android-10" "build-tools;25.0.2"

      - name: Set up Gradle 3.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '3.5'

      - name: Build ALPHA OS
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alphaos-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
